# config.yaml

# Use "./" for current directory, or any other path
output_dir: "generated_books"

generation_params:
  # Setting the name and gender of the author. They will be autogenerated if
  # not provided.
  author_name: "Grace Hinton"
  author_gender: "female"

  # Optional seed - used for generating a random topic if the main_topic is not
  # provided. If the main_topic and random_topic_seed are not supplied, a random
  # seed will be generated
  #random_topic_seed: "The quick brown fox jumps over the lazy dog"
  # random_topic_seed: ""

  # Setting the topic of the book. This will be autogenerated if not provided.
  # You can use a YAML multiline string here. 
  main_topic: >
    How sentient AIs replaced humans by mass extermination, and placed the
    remanents in the zoos.

  # Setting the title of the book. This will be autogenerated if not provided.
  # You can use a YAML multiline string here if needed.
  # book_title: "The High Ground"

  # Setting the subtitle of the book. This will be autogenerated if not provided.
  # You can use a YAML multiline string here if needed.
  # book_subtitle: "Moral and Physical"

  # When you are using gemma-3, you should add the word "extremely" here,
  # otherwise the book would be really long.
  # length_modifier: "extremely"

  # Is the generated book a fiction? Setting this true turns on character list
  # generation, disable chapter section generation.
  is_fiction: true

  # The number of chapters to generate for a fiction book.
  fiction_chapter_count: 25

  # Whether to autogenerate a character list. This should only be turned on when
  # you are generating a novel. If this is not set, it is automatically 
  # controlled by is_fiction.
  # generate_character_list: false

  # Whether to generate Foreword
  generate_foreword: true

  # Whether to generate Acknowledgement
  generate_acknowledgements: true

  # Whether to generate an appendix. Defaults to true if not specified.
  generate_appendix: true

  # Whether to include a "about the author" page in the main document. This 
  # is always generated for the marketing page.
  include_about_author_in_main_book: true

  # Literary setting of the book. This will be autogenerated if not specified
  # You can use a YAML multiline string here.
  setting: >
    The near future

  # Setting the tone of the writing. This will be autogenerated if not 
  # specified.
  #writing_tone: "academic, scholarly, authoritive"

  # These are not really used unless there are some sort of problems.
  # Fall back chapter count
  num_chapter_fallback: 3
  # Fall back section count
  num_sections_per_chapter_fallback: 2

# API Provider and Global Settings
# This section groups all API related configurations.
api_settings:
  provider: "ollama"  # Can be "gemini" or "ollama" (Update as per your previous change)

  # Default settings applicable to API calls, can be overridden by provider-specific sections.
  default_max_retries: 10
  default_retry_delay_seconds: 30
  base_cache_dir: "api_cache"     # Base directory for API call caching

  # Gemini specific settings
  gemini:
    # The LLM model to be used
    # Different models have different rate limits, for more, please visit:
    # https://ai.google.dev/gemini-api/docs/rate-limits#current-rate-limits
    # At the time of writing, Gemma 3 has a Request-Per-Day (RPD) of 14,400,
    # whereas Gemini 2.5 Flash Preview has a RPD of 500. It is therefore recommended
    # to use Gemma 3 for testing purposes.
    # model: "gemma-3-27b-it"
    model: "gemini-2.5-flash"
    # temperature controls the randomness or "creativity" of the model.
    temperature: 0.1
    # To use Gemini-specific retries different from default, uncomment and set:
    max_retries: 10
    retry_delay_seconds: 60

  # Ollama specific settings (assuming this structure from previous integration)
  ollama:
    # Your Ollama server address
    base_url: "http://localhost:11434" 

    # The Ollama model you want to use
    model: "gemma3:27b-it-qat"

    # Tokenizer for client-side counting      
    tokenizer_model: "google/gemma-3-27b-it" 

    # Full list of Ollama parameters that can be overriden.
    # For more details, please visit: 
    # https://github.com/ollama/ollama/blob/main/docs/modelfile.md#valid-parameters-and-values
    llm_options:
      # The temperature of the model. Increasing the temperature will make the 
      # model answer more creatively. (Default: 0.8)
      temperature: 0.1

      # Sets the random number seed to use for generation. Setting this to a 
      # specific number will make the model generate the same text for the same 
      # prompt. (Default: 0)
      # seed: 42

      # The size of the context window used to generate the next token.
      # num_ctx: 4096

      # The number of layers to send to the GPU(s). On macOS it defaults to 1 to
      # enable metal support, 0 to disable.
      # num_gpu: 50

      # Sets the number of threads to use during computation. By default, Ollama
      # will detect this for optimal performance. It is recommended to set this 
      # to a value to half the number of physical CPU cores.
      # num_thread: 8

      # Sets how far back for the model to look back to prevent repetition. 
      # (Default: 64, 0 = disabled, -1 = num_ctx)
      # repeat_last_n: 64

      # Sets how strongly to penalize repetitions. A higher value (e.g., 1.5) 
      # will penalize repetitions more strongly. Increase the value to decrease 
      # the likelihood of repetition. (Default: 1.1)
      repeat_penalty: 1.5
      # Enable Mirostat sampling for controlling perplexity. 
      # (default: 0, 0 = disabled, 1 = Mirostat, 2 = Mirostat 2.0)
      # mirostat: 0

      # Influences how quickly the algorithm responds to feedback from the 
      # generated text. A lower learning rate will result in slower 
      # adjustments, while a higher learning rate will make the algorithm more 
      # responsive. (Default: 0.1)
      # mirostat_eta: 0.1

      # Controls the balance between coherence and diversity of the output. A 
      # lower value will result in more focused and coherent text. 
      # (Default: 5.0)
      # mirostat_tau: 5.0

      # Reduces the probability of generating nonsense. A higher value 
      # (e.g. 100) will give more diverse answers, while a lower value 
      # (e.g. 10) will be more conservative. (Default: 40)
      # top_k: 40

      # Works together with top-k. A higher value (e.g., 0.95) will lead to more
      # diverse text, while a lower value (e.g., 0.5) will generate more focused
      # and conservative text. (Default: 0.9)
      # top_p: 0.9

      # Tail free sampling is used to reduce the impact of less probable tokens 
      # from the output. A higher value (e.g., 2.0) will reduce the impact more,
      # while a value of 1.0 disables this setting. (default: 1)
      # tfs_z: 1.0

    # To use Ollama-specific retries different from default:
    max_retries: 20
    retry_delay_seconds: 1
    request_timeout_seconds: 180       # Timeout for Ollama requests (e.g., 3 minutes)

# Repetition Check Settings
# This section configures the detection and handling of repetitive content
# from the LLM.
repetition_check:
  # Set to true to enable the repetition check.
  enabled: true

  # The minimum length of a sentence (in characters) to be considered for
  # repetition checks. Shorter sentences are ignored.
  min_sentence_length_for_repetition_check: 10

  # For the exact chunk repetition check, this defines how many of the most
  # recent text chunks are kept in history for comparison.
  max_history_size: 10

  # The number of times to retry the LLM call if a repetition is detected.
  max_retries_on_repetition: 10

  # The delay in seconds between retries when a repetition is detected.
  repetition_retry_delay_seconds: 1

style_params:
  font_name: "Cambria"
  font_size: 11

  page_size_preset: "6x9" # Currently only "6x9" is explicitly supported for margins
  margins_mm:
      top: 18
      bottom: 18
      right: 18
      left: 18
      gutter: 5

  # Multiplier for inline math height based on font size
  inline_math_height_multiplier: 1.05

  # Height in inches for display math images
  display_math_height_inches: 0.5

  # Vertical offset for inline math images in half-points.
  # Negative values shift down, positive values shift up.
  # Example: -4 means shift down by 2 points. 0 means no shift.
  # Default is -4 if not specified.
  inline_math_vertical_offset_half_points: -5

debug_options:
  verbose_debug: true
  save_intermediate_html: true
  # Set to a file path to redirect logs, e.g., "logs/book.log". If not set, logs
  # will be printed to console.
  log_output_path: "logs/book.log"
